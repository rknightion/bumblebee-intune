name: PR metadata
run-name: PR ${{ github.event.pull_request.number }} metadata

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: caller-pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/pr-metadata.yml@9030a1b7d1d6652c0447b4a8e4181923105a0371 # v1.31.11
    with:
      runs-on: ubuntu-latest
      harden: true

  metadata-ac-evidence:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@9030a1b7d1d6652c0447b4a8e4181923105a0371 # v1.31.11

  pr-metadata-success:
    name: pr-metadata-success
    if: ${{ always() }}
    needs: [metadata, metadata-ac-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both metadata checks to pass
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          ACCEPTANCE_RESULT: ${{ needs.metadata-ac-evidence.result }}
        run: |
          if [[ "$METADATA_RESULT" != success || "$ACCEPTANCE_RESULT" != success ]]; then
            echo "PR metadata: $METADATA_RESULT, acceptance evidence: $ACCEPTANCE_RESULT"
            exit 1
          fi
