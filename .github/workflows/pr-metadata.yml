name: PR metadata
run-name: PR ${{ github.event.pull_request.number }} metadata

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: caller-pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/pr-metadata.yml@47976d7e85fddb1c3c329cc870612b59ac433849 # v1.32.8
    with:
      runs-on: ubuntu-latest
      harden: true

  # A pull request that closes an issue shows evidence for each of its acceptance criteria. Checks
  # only pull requests with a closing keyword (enforce-all-prs: false), because this repository takes
  # outside and bot pull requests. Check run: `ac-evidence / Acceptance evidence`.
  ac-evidence:
    # The reusable fails on any event but pull_request; this workflow runs on pull requests only.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@47976d7e85fddb1c3c329cc870612b59ac433849 # v1.32.8

  pr-metadata-success:
    name: pr-metadata-success
    if: ${{ always() }}
    needs: [metadata, ac-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both metadata checks to pass
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          ACCEPTANCE_RESULT: ${{ needs.ac-evidence.result }}
        run: |
          if [[ "$METADATA_RESULT" != success || "$ACCEPTANCE_RESULT" != success ]]; then
            echo "PR metadata: $METADATA_RESULT, acceptance evidence: $ACCEPTANCE_RESULT"
            exit 1
          fi
