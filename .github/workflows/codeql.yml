name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 4'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@223d9483075f648075df1a806c2ad4db42101a7f # v1.25.25
    with:
      # Docs-only for now. Add the real language here when code samples land.
      languages: '[{"language":"actions","build-mode":"none"}]'
