name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 4'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@ca86dc7c1901c83e64deef48ee2811fa569e8c28 # v1.25.14
    with:
      # Docs-only for now. Add the real language here when code samples land.
      languages: '[{"language":"actions","build-mode":"none"}]'
