name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 4'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@2c2a3771006d75783f612a61a2bd406449a3410f # v1.25.11
    with:
      # Docs-only for now. Add the real language here when code samples land.
      languages: '[{"language":"actions","build-mode":"none"}]'
