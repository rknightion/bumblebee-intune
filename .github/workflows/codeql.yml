name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 4'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@5a2b8d059084a79d11c9675f2fd07abd7003f915 # v1.13.0
    with:
      # Docs-only for now. Add the real language here when code samples land.
      languages: '[{"language":"actions","build-mode":"none"}]'
