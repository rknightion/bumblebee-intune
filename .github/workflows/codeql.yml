name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 4'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@9c3981da69a2aa4eecd99e5740335219fd8c6a00 # v1.9.10
    with:
      # Docs-only for now. Add the real language here when code samples land.
      languages: '[{"language":"actions","build-mode":"none"}]'
